<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="description" content="Send short messages between nearby devices as sound." />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/icon-192.png" />
    <title>Whoosh</title>
  </head>
  <body>
    <main>
      <header>
        <h1>Whoosh</h1>
        <p>Short messages between nearby devices, sent as sound.</p>
      </header>

      <nav role="tablist" aria-label="Screens">
        <button role="tab" data-tab="send" aria-selected="true">Send</button>
        <button role="tab" data-tab="receive" aria-selected="false">Receive</button>
        <button role="tab" data-tab="diag" aria-selected="false">Diagnostics</button>
      </nav>

      <section id="send" role="tabpanel">
        <label for="text">Message</label>
        <textarea id="text" rows="3" placeholder="blue river quick zoo" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
        <p id="hint" class="hint">Type a message. Up to 512 bytes.</p>
        <label class="check"><input id="loop" type="checkbox" /> Repeat until stopped</label>
        <button id="sendBtn" class="primary" type="button">Send as sound</button>
        <button id="beepBtn" class="secondary" type="button">Play test beep</button>
        <p id="sendStatus" class="status" role="status"></p>
      </section>

      <section id="receive" role="tabpanel" hidden>
        <button id="listenBtn" class="primary" type="button">Start listening</button>
        <div class="meter" aria-hidden="true"><div id="level"></div></div>
        <p id="recvStatus" class="status" role="status">Not listening.</p>
        <ul id="inbox" class="inbox"></ul>
      </section>

      <section id="diag" role="tabpanel" hidden>
        <dl id="stats" class="stats"></dl>
        <div id="tones" class="tones" aria-label="Tone levels"></div>
        <p class="hint">Start listening on the Receive screen, then play a message from the other device. Two rows of 16 bars: each should show one clear peak while a message is playing.</p>
      </section>
    </main>
    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
