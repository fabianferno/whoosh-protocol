<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" font-family="'Excalifont','Virgil','Segoe Print','Comic Sans MS',sans-serif"><rect width="100%" height="100%" fill="#fff"/><text x="750" y="64" font-size="34" fill="#1e1e1e" text-anchor="middle">Whoosh architecture: one browser app, layered</text><text x="750" y="100" font-size="20" fill="#555" text-anchor="middle">Runs as an installable PWA, fully offline once installed.</text><rect x="80" y="160" width="1340" height="90" rx="14" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2" /><text x="750" y="214" font-size="24" fill="#1e1e1e" text-anchor="middle">UI: Send | Receive | Group | Arkiv | Debug</text><rect x="80" y="300" width="640" height="150" rx="14" fill="#ffd43b" stroke="#1e1e1e" stroke-width="2" /><text x="400" y="357.5" font-size="20" fill="#1e1e1e" text-anchor="middle">Packet + crypto layer</text><text x="400" y="382.5" font-size="20" fill="#1e1e1e" text-anchor="middle">HKDF channel tag, AES-GCM, PRD nonce</text><text x="400" y="407.5" font-size="20" fill="#1e1e1e" text-anchor="middle">sender | seq | ts, fragmenting</text><rect x="780" y="300" width="640" height="150" rx="14" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2" /><text x="1100" y="357.5" font-size="20" fill="#1e1e1e" text-anchor="middle">Relay mesh</text><text x="1100" y="382.5" font-size="20" fill="#1e1e1e" text-anchor="middle">listen-before-talk, random backoff</text><text x="1100" y="407.5" font-size="20" fill="#1e1e1e" text-anchor="middle">ttl, duplicate suppression</text><rect x="80" y="500" width="640" height="150" rx="14" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2" /><text x="400" y="557.5" font-size="20" fill="#1e1e1e" text-anchor="middle">Acoustic modem</text><text x="400" y="582.5" font-size="20" fill="#1e1e1e" text-anchor="middle">ggwave ultrasound mode (WASM)</text><text x="400" y="607.5" font-size="20" fill="#1e1e1e" text-anchor="middle">Web Audio: mic in, speaker out</text><rect x="780" y=