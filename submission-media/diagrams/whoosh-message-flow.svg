<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" font-family="'Excalifont','Virgil','Segoe Print','Comic Sans MS',sans-serif"><rect width="100%" height="100%" fill="#fff"/><text x="750" y="64" font-size="34" fill="#1e1e1e" text-anchor="middle">Whoosh: a message travels as sound, then settles to Arkiv</text><text x="750" y="100" font-size="20" fill="#555" text-anchor="middle">Encrypted with a key shared in person. No network needed until a gateway gets online.</text><rect x="60" y="200" width="240" height="120" rx="14" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2" /><text x="180" y="242.5" font-size="20" fill="#1e1e1e" text-anchor="middle">Phone A</text><text x="180" y="267.5" font-size="20" fill="#1e1e1e" text-anchor="middle">encrypt + packet</text><text x="180" y="292.5" font-size="20" fill="#1e1e1e" text-anchor="middle">(AES-256-GCM)</text><rect x="400" y="200" width="240" height="120" rx="14" fill="#ffd43b" stroke="#1e1e1e" stroke-width="2" /><text x="520" y="242.5" font-size="20" fill="#1e1e1e" text-anchor="middle">Near-ultrasound</text><text x="520" y="267.5" font-size="20" fill="#1e1e1e" text-anchor="middle">15-19.5 kHz</text><text x="520" y="292.5" font-size="20" fill="#1e1e1e" text-anchor="middle">(ggwave)</text><rect x="740" y="200" width="240" height="120" rx="14" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2" /><text x="860" y="242.5" font-size="20" fill="#1e1e1e" text-anchor="middle">Phone B</text><text x="860" y="267.5" font-size="20" fill="#1e1e1e" text-anchor="middle">listen, relay</text><text x="860" y="292.5" font-size="20" fill="#1e1e1e" text-anchor="middle">after quiet 300 ms</text><rect x="1080" y="200" width="240" height="120" rx="14" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2" /><text x="1200" y="242.5" font-size="20" fill="#1e1e1e" text-anchor="middle">Phone C</text><text x="1200" y="267.5" font-size="20" fill="#1e1e1e" text-anchor="middle">relay, ttl - 1</text><text x="1200" y="292.5" font-size="20" fill="#1e1e1e" text-anchor="middle">(3 hops default)</text><g stroke="#1e1e1e" stroke-width="2.5" fill="none" stroke-linecap="round" ><line x1="300" y1="260" x2="400" y2="260"/></g><path d="M387.39374056706254 253.91048252244278 L400 260 L387.39374056706254 266.08951747755725" stroke="#1e1e1e" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="350" y="246" font-size="16" fill="#1e1e1e" text-anchor="middle">speaker</text><g stroke="#1e1e1e" stroke-width="2.5" fill="none" stroke-linecap="round" ><line x1="640" y1="260" x2="740" y2="260"/></g><path d="M727.3937405670625 253.91048252244278 L740 260 L727.3937405670625 266.08951747755725" stroke="#1e1e1e" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="690" y="246" font-size="16" fill="#1e1e1e" text-anchor="middle">mic</text><g stroke="#1e1e1e" stroke-width="2.5" fill="none" stroke-linecap="round" ><line x1="980" y1="260" x2="1080" y2="260"/></g><path d="M1067.3937405670624 253.91048252244278 L1080 260 L1067.3937405670624 266.08951747755725" stroke="#1e1e1e" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="1030" y="246" font-size="16" fill="#1e1e1e" text-anchor="middle">sound</text><rect x="740" y="460" width="240" height="110" rx="14" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2" /><text x="860" y="510" font-size="20" fill="#1e1e1e" text-anchor="middle">Gateway phone</text><text x="860" y="535" font-size="20" fill="#1e1e1e" text-anchor="middle">(has internet)</text><g stroke="#1e1e1e" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-dasharray="8 6"><line x1="860" y1="320" x2="860" y2="460"/></g><path d="M866.0895174775573 447.39374056706254 L860 460 L853.9104825224427 447.39374056706254" stroke="#1e1e1e" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="860" y="376" font-size="16" fill="#1e1e1e" text-anchor="middle">heard it</text><rect x="1080" y="460" width="300" height="110" rx="14" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2" /><text x="1230" y="497.5" font-size="20" fill="#1e1e1e" text-anchor="middle">Arkiv (Tiramisu)</text><text x="1230" y="522.5" font-size="20" fill="#1e1e1e" text-anchor="middle">whoosh.msg entity</text><text x="1230" y="547.5" font-size="20" fill="#1e1e1e" text-anchor="middle">ciphertext only</text><g stroke="#1e1e1e" stroke-width="2.5" fill="none" stroke-linecap="round" ><line x1="980" y1="515" x2="1080" y2="515"/></g><path d="M1067.3937405670624 508.91048252244275 L1080 515 L1067.3937405670624 521.0895174775573" stroke="#1e1e1e" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="1030" y="501" font-size="16" fill="#1e1e1e" text-anchor="middle">settle</text><rect x="400" y="640" width="300" height="90" rx="14" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2" /><text x="550" y="680.5" font-size="18" fill="#1e1e1e" text-anchor="middle">Phones in another place</text><text x="550" y="703" font-size="18" fill="#1e1e1e" text-anchor="middle">pull from Arkiv</text><g stroke="#1e1e1e" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-dasharray="8 6"><line x1="1080" y1="560" x2="700" y2="660"/></g><path d="M713.7409339016054 662.6808087420981 L700 660 L710.6414511138363 650.9027741485752" stroke="#1e1e1e" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="940" y="656" font-size="16" fill="#1e1e1e" text-anchor="middle">query by channel + time</text><rect x="60" y="640" width="260" height="90" rx="14" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2" /><text x="190" y="680.5" font-size="18" fill="#1e1e1e" text-anchor="middle">Replay over sound</text><text x="190" y="703" font-size="18" fill="#1e1e1e" text-anchor="middle">to the people nearby</text><g stroke="#1e1e1e" stroke-width="2.5" fill="none" stroke-linecap="round" ><line x1="400" y1="685" x2="320" y2="685"/></g><path d="M332.60625943293746 691.0895174775573 L320 685 L332.60625943293746 678.9104825224427" stroke="#1e1e1e" stroke-width="2.5" fill="none" stroke-linecap="round"/><rect x="60" y="440" width="260" height="130" rx="14" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2" /><text x="190" y="487.5" font-size="20" fill="#1e1e1e" text-anchor="middle">Group key</text><text x="190" y="512.5" font-size="20" fill="#1e1e1e" text-anchor="middle">six words, shared</text><text x="190" y="537.5" font-size="20" fill="#1e1e1e" text-anchor="middle">in person</text><g stroke="#1e1e1e" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-dasharray="8 6"><line x1="190" y1="440" x2="190" y2="320"/></g><path d="M183.91048252244278 332.60625943293746 L190 320 L196.08951747755722 332.60625943293746" stroke="#1e1e1e" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="205" y="386" font-size="16" fill="#1e1e1e" text-anchor="start">key</text></svg>